        .center-sub {

    <script>

            'https://i.postimg.cc/XqNwn9RB/LKBJXYFNZFA4ZOPCAUZZBXZMQA.jpg',
            'https://i.postimg.cc/MHZyz1CV/rick-morty-game.png',

        ];

        function iniciarFondosRotativos() {

            FONDOS.forEach(src => { const img = new Image(); img.src = src; });

            const capaA = document.getElementById('bg-a');
            const capaB = document.getElementById('bg-b');

            setInterval(() => {

                const actual = usandoA ? capaA : capaB;

                siguiente.style.backgroundImage = `url('${FONDOS[idx]}')`;
                siguiente.classList.add('visible');
                actual.classList.remove('visible');

            }, INTERVALO_FONDO_MS);

        let userData = { numero: '', nombre: '' };

        let indiceActual = 0;
        let apuestas = {};

        const FRUTAS = [

            { id: 'apple',  icon: '🍎', mult: 5,   r: 5, c: 7 },

        /* ================= MOTOR DE AUDIO RETRO 8-BIT ================= */
        const RetroSFX = (() => {
            let ctx = null;
            let silenciado = false;

            function init() {
                if (!ctx) {
                    const AudioCtx = window.AudioContext || window.webkitAudioContext;
                    ctx = new AudioCtx();
                }
                if (ctx.state === 'suspended') ctx.resume();
            }

            function tono(freq, duracion, tipo = 'square', vol = 0.08, delay = 0) {
                if (silenciado) return;
                init();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                const inicio = ctx.currentTime + delay;

                osc.type = tipo;
                osc.frequency.setValueAtTime(freq, inicio);

                gain.gain.setValueAtTime(vol, inicio);
                gain.gain.exponentialRampToValueAtTime(0.001, inicio + duracion);

                osc.connect(gain);
                gain.connect(ctx.destination);

                osc.start(inicio);
                osc.stop(inicio + duracion);
            }

            return {
                toggleMute() {
                    silenciado = !silenciado;
                    return silenciado;
                },
                moneda() {
                    tono(987, 0.06, 'square', 0.06, 0);
                    tono(1318, 0.1, 'square', 0.06, 0.05);
                },
                paso(idx) {
                    const notas = [330, 392, 440, 523, 587, 659];
                    tono(notas[idx % notas.length], 0.045, 'square', 0.055);
                },
                ganar() {
                    [523, 659, 784, 1046, 784, 1046].forEach((n, i) => tono(n, 0.12, 'square', 0.09, i * 0.08));
                },
                perder() {
                    tono(280, 0.14, 'sawtooth', 0.07, 0);
                    tono(190, 0.24, 'sawtooth', 0.07, 0.14);
                }
            };
        })();

        function toggleSonido() {
            const muted = RetroSFX.toggleMute();
            document.getElementById('btn-mute').innerText = muted ? '🔇' : '🔊';
        }

        function construirUI() {
            const board = document.getElementById('board-grid');
            CASILLAS.forEach((tile, i) => {
                const el = document.createElement('div');
                el.className = 'tile' + (tile.special ? ' special' : '');
                el.id = `tile-${i}`;
                el.style.gridRow = tile.r;
                el.style.gridColumn = tile.c;
                el.innerHTML = `<span class="tile-icon">${tile.icon}</span><span class="tile-mult">${tile.special ? 'BONUS' : 'x' + tile.mult}</span>`;
                board.appendChild(el);
            });

            const betGrid = document.getElementById('bet-grid');
            FRUTAS.forEach(f => {
                apuestas[f.id] = 0;
                const btn = document.createElement('button');
                btn.className = 'fruit-btn';
                btn.id = `btn-f-${f.id}`;
                btn.onclick = () => apostarFruta(f.id);
                btn.innerHTML = `
                    <span class="f-mult">x${f.mult}</span>
                    <span class="f-icon">${f.icon}</span>
                    <span class="f-bet" id="bet-val-${f.id}">0</span>
                `;
                betGrid.appendChild(btn);
            });
        }

        window.onload = () => {
            iniciarFondosRotativos();
            construirUI();
            const params = new URLSearchParams(window.location.search);
            if (params.get('num')) document.getElementById('input-num').value = params.get('num');
            if (params.get('user')) document.getElementById('input-name').value = params.get('user');
            saldoActual = parseInt(params.get('cr')) || 0;
            actualizarHUD();
        };

        function actualizarHUD() {
            document.getElementById('ui-saldo').innerText = saldoActual.toLocaleString();
            let total = 0;
            FRUTAS.forEach(f => {
                const val = apuestas[f.id] || 0;
                total += val;
                document.getElementById(`bet-val-${f.id}`).innerText = val;
                document.getElementById(`btn-f-${f.id}`).classList.toggle('has-bet', val > 0);
            });
            document.getElementById('ui-total-bet').innerText = total.toLocaleString();
        }

        function setSyncEstado(texto, color) {
            const el = document.getElementById('ui-sync');
            el.innerText = texto;
            el.style.background = color;
        }

        async function iniciarConsola() {
            userData.numero = document.getElementById('input-num').value.replace(/[^0-9]/g, '');
            userData.nombre = document.getElementById('input-name').value.trim() || 'Jugador';
            if (!userData.numero) return alert('Debes ingresar tu número.');

            RetroSFX.moneda();
            document.getElementById('ui-player').innerText = userData.nombre;
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('game-screen').style.display = 'flex';

            try {
                setSyncEstado('⏳ SYNC...', '#d97706');
                const res = await fetch(`${API_URL}/api/saldo/${userData.numero}`);
                const data = await res.json();
                if (data.ok && data.saldo !== undefined) {
                    saldoActual = Number(data.saldo);
                    actualizarHUD();
                    setSyncEstado('🟢 EN VIVO', 'linear-gradient(180deg, #25d366 0%, #128c7e 100%)');
                }
            } catch (e) {
                setSyncEstado('🔴 OFFLINE', '#b31222');
            }
        }

        async function sincronizarSaldo() {
            try {
                setSyncEstado('⏳ GUARDANDO', '#d97706');
                const res = await fetch(`${API_URL}/api/slot`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ numero: userData.numero, saldo: saldoActual })
                });
                const data = await res.json();
                if (data.ok) {
                    setSyncEstado('🟢 EN VIVO', 'linear-gradient(180deg, #25d366 0%, #128c7e 100%)');
                }
            } catch (e) {
                setSyncEstado('🔴 ERROR', '#b31222');
            }
        }

        function apostarFruta(id) {
            if (girando) return;
            if (saldoActual < PASO_APUESTA) return alert('❌ Saldo insuficiente.');
            saldoActual -= PASO_APUESTA;
            apuestas[id] = (apuestas[id] || 0) + PASO_APUESTA;
            RetroSFX.moneda();
            actualizarHUD();
        }

        function limpiarApuestas() {
            if (girando) return;
            FRUTAS.forEach(f => {
                saldoActual += apuestas[f.id] || 0;
                apuestas[f.id] = 0;
            });
            actualizarHUD();
        }

        function repetirApuesta() {
            if (girando) return;
            let costo = 0;
            FRUTAS.forEach(f => costo += ultimaApuesta[f.id] || 0);
            if (costo === 0) return;
            limpiarApuestas();
            if (saldoActual < costo) return alert('❌ Saldo insuficiente para repetir.');
            FRUTAS.forEach(f => {
                apuestas[f.id] = ultimaApuesta[f.id] || 0;
                saldoActual -= apuestas[f.id];
            });
            RetroSFX.moneda();
            actualizarHUD();
        }

        function iniciarGiro() {
            if (girando) return;
            let totalApostado = 0;
            FRUTAS.forEach(f => totalApostado += apuestas[f.id] || 0);
            if (totalApostado === 0) return alert('Toca al menos una fruta para apostar.');

            ultimaApuesta = { ...apuestas };

            girando = true;
            document.getElementById('btn-play').disabled = true;
            document.getElementById('btn-clear').disabled = true;
            document.getElementById('btn-repeat').disabled = true;
            document.getElementById('ui-premio').innerText = '0';

            const status = document.getElementById('ui-status');
            status.className = 'center-display';
            status.innerText = '¡BUENA SUERTE!';

            document.querySelectorAll('.tile').forEach(t => t.classList.remove('active', 'winner'));

            const destino = Math.floor(Math.random() * CASILLAS.length);
            const vueltas = 3 * CASILLAS.length;
            const pasosTotales = vueltas + ((destino - indiceActual + CASILLAS.length) % CASILLAS.length);

            let paso = 0;

            function avanzarLuz() {
                document.getElementById(`tile-${indiceActual}`).classList.remove('active');
                indiceActual = (indiceActual + 1) % CASILLAS.length;
                document.getElementById(`tile-${indiceActual}`).classList.add('active');
                RetroSFX.paso(paso);
                paso++;

                if (paso < pasosTotales) {
                    const restantes = pasosTotales - paso;
                    let delay = 45;
                    if (restantes < 14) {
                        delay = 45 + Math.pow(14 - restantes, 2) * 2.2;
                    }
                    setTimeout(avanzarLuz, delay);
                } else {
                    finalizarGiro(destino, totalApostado);
                }
            }

            avanzarLuz();
        }

        async function finalizarGiro(destino, totalApostado) {
            const casilla = CASILLAS[destino];
            const tileEl = document.getElementById(`tile-${destino}`);
            const status = document.getElementById('ui-status');

            let premio = 0;

            if (casilla.special) {
                premio = totalApostado * 2;
                tileEl.classList.add('winner');
                status.innerText = `🍀 ¡BONUS x2! +${premio.toLocaleString()}`;
                RetroSFX.ganar();
            } else {
                const apostadoAEsta = apuestas[casilla.id] || 0;
                if (apostadoAEsta > 0) {
                    premio = apostadoAEsta * casilla.mult;
                    tileEl.classList.add('winner');
                    status.innerText = `${casilla.icon} ¡GANASTE +${premio.toLocaleString()}!`;
                    RetroSFX.ganar();
                } else {
                    status.className = 'center-display lose';
                    status.innerText = `CAYÓ ${casilla.icon} • INTENTA DE NUEVO`;
                    RetroSFX.perder();
                }
            }

            saldoActual += premio;
            document.getElementById('ui-premio').innerText = premio.toLocaleString();

            FRUTAS.forEach(f => apuestas[f.id] = 0);
            actualizarHUD();

            await sincronizarSaldo();

            girando = false;
            document.getElementById('btn-play').disabled = false;
            document.getElementById('btn-clear').disabled = false;
            document.getElementById('btn-repeat').disabled = false;
        }
    </script>
</body>
</html>
