<!DOCTYPE html>

        /* ================= CONTENEDOR PRINCIPAL ================= */

        /* ================= BARRA SUPERIOR (HUD) ================= */
        .top-hud {

        .player-badge {

        .avatar-circle {

        .player-name {

        .pill {

        .btn-mute:active {
            transform: scale(0.92);
        }

        .btn-mute.muted {

        .sync-badge {
            background: linear-gradient(180deg, #25d366 0%, #128c7e 100%);

            font-family: 'Chakra Petch', sans-serif;

            padding: 6px 7px;

        /* ================= GABINETE DE CASINO ================= */

        .cabinet-inner {
            background: linear-gradient(180deg, #1b0a3d 0%, #0d0521 100%);

            padding: 12px 10px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            border: 2px solid #5c27b8;
        }

        /* Marquesina de Jackpots */
        .marquee {
            background: linear-gradient(180deg, #100426 0%, #1d0942 100%);
            border: 2px solid #13eb2b;
            border-radius: 12px;
            padding: 8px;
            box-shadow: inset 0 0 15px rgba(19, 235, 43, 0.2);
        }

        .marquee-title {
            text-align: center;
            font-family: 'Orbitron', sans-serif;
            font-size: 13px;
            font-weight: 900;
            color: #ffd700;
            text-shadow: 0 0 10px rgba(255, 215, 0, 0.7);
            letter-spacing: 1.5px;
            margin-bottom: 6px;
        }

        .paytable-row {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 4px;
        }

        .pay-chip {
            background: rgba(0, 0, 0, 0.55);
            border: 1px solid rgba(255, 215, 0, 0.45);
            border-radius: 7px;
            padding: 4px 2px;
            text-align: center;
            font-size: 10px;
            font-weight: 700;
            color: #13eb2b;
        }

        .pay-chip span {
            display: block;
            font-size: 15px;
            line-height: 1.2;
        }

        /* Ventana de Rodillos 3D */
        .reels-frame {
            position: relative;
            background: linear-gradient(180deg, #2b2b2b 0%, #000 100%);
            border: 4px solid #ffd700;
            border-radius: 14px;
            padding: 10px 8px;
            box-shadow: inset 0 0 20px #000, 0 0 15px rgba(255, 215, 0, 0.3);
        }

        .payline {
            position: absolute;
            left: 0;
            right: 0;
            top: 50%;
            height: 3px;
            background: linear-gradient(90deg, #ff0055, #13eb2b, #ffd700, #13eb2b, #ff0055);
            transform: translateY(-50%);
            opacity: 0.75;
            pointer-events: none;
            z-index: 3;
            box-shadow: 0 0 8px #13eb2b;
        }

        .reels-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            position: relative;
            z-index: 2;
        }

        .reel {
            height: 122px;
            border-radius: 10px;
            background: linear-gradient(180deg,
                #8f9bb3 0%,
                #eef2f7 18%,
                #ffffff 50%,
                #eef2f7 82%,
                #7b879e 100%);
            border: 2px solid #4a5568;
            box-shadow: inset 0 14px 16px rgba(0, 0, 0, 0.38),
                        inset 0 -14px 16px rgba(0, 0, 0, 0.38);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 56px;
            overflow: hidden;
            transition: transform 0.15s, box-shadow 0.2s;
        }

        .reel.winner {
            border-color: #13eb2b;
            box-shadow: 0 0 18px #13eb2b,
                        inset 0 0 16px rgba(19, 235, 43, 0.55);
            animation: winPulse 0.45s ease-in-out infinite alternate;
        }

        .reel.spinning {
            animation: reelSpin 0.09s linear infinite;
            filter: blur(2.5px);
        }

        @keyframes reelSpin {
            0% { transform: translateY(-8px); }
            50% { transform: translateY(8px); }
            100% { transform: translateY(-8px); }
        }

        @keyframes winPulse {
            from { transform: scale(1); }
            to { transform: scale(1.04); }
        }

        .status-bar {
            background: linear-gradient(90deg, #14072e, #2d1066, #14072e);
            border: 1.5px solid #7c4dff;
            border-radius: 10px;
            padding: 8px 10px;
            text-align: center;
            font-family: 'Orbitron', sans-serif;
            font-size: 13px;

            color: #fff;
            letter-spacing: 1px;
            text-shadow: 0 0 8px rgba(124, 77, 255, 0.9);
        }

        .status-bar.win {
            color: #13eb2b;
            border-color: #13eb2b;
            text-shadow: 0 0 10px #13eb2b;
        }

        .status-bar.lose {
            color: #ff6b81;
        }

        /* ================= PANEL INFERIOR DE CONTROLES ================= */
        .control-deck {
            width: 100%;
            background: linear-gradient(180deg, #24104d 0%, #100524 100%);

        .bet-box {

            padding: 6px;
            display: flex;

        .deck-label {

            color: #c8b6ff;
            letter-spacing: 1.2px;
        }

        .bet-stepper {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 5px;
        }

        .btn-step {
            width: 34px;
            height: 34px;
            border: none;
            border-radius: 8px;
            font-family: 'Orbitron', sans-serif;
            font-size: 18px;
            font-weight: 900;
            color: #fff;
            cursor: pointer;
            flex-shrink: 0;
        }

        .btn-minus {
            background: linear-gradient(180deg, #ff5e6c 0%, #b31222 100%);

        }

        .btn-plus {
            background: linear-gradient(180deg, #2ecc71 0%, #168043 100%);

        }

        .btn-step:active {

        #bet-input {
            width: 100%;
            min-width: 0;
            background: transparent;
            border: none;
            color: #ffd700;
            font-family: 'Orbitron', sans-serif;
            font-size: 16px;
            font-weight: 900;
            text-align: center;
            outline: none;
        }

        .last-win-box {
            background: #080312;
            border: 2px solid #5f27cd;
            border-radius: 12px;
            padding: 6px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 4px;
        }

        #ui-last-win {
            font-family: 'Orbitron', sans-serif;
            font-size: 17px;
            font-weight: 900;
            color: #13eb2b;
            text-shadow: 0 0 8px rgba(19, 235, 43, 0.6);
        }

        .deck-row-bottom {
            display: grid;
            grid-template-columns: 1fr 2fr;
            gap: 8px;
        }

        .btn-max {
            background: linear-gradient(180deg, #ffbe0b 0%, #d97706 100%);
            border: 2px solid #fff3b0;
            border-radius: 14px;
            color: #1f0f00;
            font-family: 'Orbitron', sans-serif;
            font-weight: 900;
            font-size: 13px;
            line-height: 1.15;
            cursor: pointer;
            box-shadow: 0 5px 0 #8a4b00;
            padding: 10px 6px;
        }

        .btn-max:active {
            transform: translateY(4px);
            box-shadow: 0 1px 0 #8a4b00;
        }

        .btn-spin {
            background: linear-gradient(180deg, #39ff14 0%, #0ea81f 100%);
            border: 2px solid #d4ffca;
            border-radius: 14px;
            color: #032206;
            font-family: 'Orbitron', sans-serif;
            font-weight: 900;
            font-size: 22px;
            letter-spacing: 2px;
            cursor: pointer;
            box-shadow: 0 5px 0 #075c11, 0 0 18px rgba(57, 255, 20, 0.45);
            padding: 12px;
        }

        .btn-spin:active {
            transform: translateY(4px);

        .btn-spin:disabled {
            background: linear-gradient(180deg, #666 0%, #3d3d3d 100%);
            border-color: #999;
            color: #ccc;
            box-shadow: 0 5px 0 #222;
            cursor: not-allowed;
        }
    </style>

<body>

    <!-- PANTALLA DE REGISTRO -->

    <!-- CONSOLA PRINCIPAL -->
    <div id="game-screen">

        <div class="cabinet">

                    <div class="paytable-row">
                        <div class="pay-chip"><span>💎</span>x100</div>
                        <div class="pay-chip"><span>🍉</span>x50</div>
                        <div class="pay-chip"><span>🍇</span>x10</div>

         <!-- CONTROLES INFERIORES -->
        <div class="control-deck">

                        <button class="btn-step btn-minus" onclick="ajustarApuesta(-50)">−</button>

                        <button class="btn-step btn-plus" onclick="ajustarApuesta(50)">+</button>

            </div>

            <div class="deck-row-bottom">
                <button class="btn-max" onclick="apuestaMaxima()">MAX<br>BET</button>
                <button class="btn-spin" id="btn-spin" onclick="tirarSlot()">SPIN</button>

        </div>

    </div>

    <script>
        const API_URL = 'https://casino.curvainfinitacentral.com';

        let userData = { numero: '', nombre: '' };
        let saldoActual = 0;
        let totalPerdido = 0;
        const emojis = ['🍒', '🍊', '🍉', '🍇', '💎'];

        /* ================= MOTOR DE AUDIO RETRO 8-BIT ================= */
        const RetroSFX = (() => {
            let ctx = null;
            let silenciado = false;

            function init() {
                if (!ctx) {
                    const AudioCtx = window.AudioContext || window.webkitAudioContext;
                    ctx = new AudioCtx();
                }
                if (ctx.state === 'suspended') ctx.resume();
            }

            function tono(freq, duracion, tipo = 'square', vol = 0.08, delay = 0) {
                if (silenciado) return;
                init();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                const inicio = ctx.currentTime + delay;

                osc.type = tipo;
                osc.frequency.setValueAtTime(freq, inicio);

                gain.gain.setValueAtTime(vol, inicio);
                gain.gain.exponentialRampToValueAtTime(0.001, inicio + duracion);

                osc.connect(gain);
                gain.connect(ctx.destination);

                osc.start(inicio);
                osc.stop(inicio + duracion);
            }

            return {
                toggleMute() {
                    silenciado = !silenciado;
                    return silenciado;
                },
                click() {
                    tono(620, 0.05, 'square', 0.06);
                },
                giro() {
                    for (let i = 0; i < 10; i++) {
                        tono(280 + (i % 3) * 90, 0.04, 'square', 0.05, i * 0.085);
                    }
                },
                ganar() {
                    [523, 659, 784, 1046].forEach((n, i) => tono(n, 0.12, 'square', 0.08, i * 0.08));
                },
                jackpot() {
                    [523, 659, 784, 1046, 784, 1046, 1318, 1568].forEach((n, i) => tono(n, 0.14, 'square', 0.09, i * 0.09));
                },
                perder() {
                    tono(300, 0.14, 'sawtooth', 0.07, 0);
                    tono(220, 0.22, 'sawtooth', 0.07, 0.13);
                }
            };
        })();

        function toggleSonido() {
            const muted = RetroSFX.toggleMute();
            const btn = document.getElementById('btn-mute');
            btn.innerText = muted ? '🔇' : '🔊';
            btn.classList.toggle('muted', muted);
            if (!muted) RetroSFX.click();
        }

        /* ================= LÓGICA DEL CASINO ================= */
        window.onload = () => {
            const params = new URLSearchParams(window.location.search);
            if (params.get('num')) document.getElementById('input-num').value = params.get('num');
            if (params.get('user')) document.getElementById('input-name').value = params.get('user');
            saldoActual = parseInt(params.get('cr')) || 0;
            actualizarHUD();
        };

        function actualizarHUD() {
            document.getElementById('ui-saldo').innerText = saldoActual.toLocaleString();
            document.getElementById('ui-perdido').innerText = totalPerdido.toLocaleString();
        }

        function setSyncEstado(texto, color) {
            const el = document.getElementById('ui-sync');
            el.innerText = texto;
            el.style.background = color;
        }

        async function iniciarConsola() {
            userData.numero = document.getElementById('input-num').value.replace(/[^0-9]/g, '');
            userData.nombre = document.getElementById('input-name').value.trim() || 'Morty';
            if (!userData.numero) return alert('Debes ingresar tu número para jugar.');

            RetroSFX.click();
            document.getElementById('ui-player').innerText = userData.nombre;
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('game-screen').style.display = 'flex';

            try {
                setSyncEstado('⏳ SYNC...', '#d97706');
                const res = await fetch(`${API_URL}/api/saldo/${userData.numero}`);
                const data = await res.json();
                if (data.ok && data.saldo !== undefined) {
                    saldoActual = Number(data.saldo);
                    actualizarHUD();
                    setSyncEstado('🟢 EN VIVO', 'linear-gradient(180deg, #25d366 0%, #128c7e 100%)');
                }
            } catch (e) {
                setSyncEstado('🔴 OFFLINE', '#b31222');
            }
        }

        async function sincronizarSaldo() {
            try {
                setSyncEstado('⏳ GUARDANDO', '#d97706');
                const res = await fetch(`${API_URL}/api/slot`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ numero: userData.numero, saldo: saldoActual })
                });
                const data = await res.json();
                if (data.ok) {
                    setSyncEstado('🟢 EN VIVO', 'linear-gradient(180deg, #25d366 0%, #128c7e 100%)');
                }
            } catch (e) {
                setSyncEstado('🔴 ERROR', '#b31222');
            }
        }

        function ajustarApuesta(delta) {
            RetroSFX.click();
            const input = document.getElementById('bet-input');
            let nuevo = (parseInt(input.value) || 0) + delta;
            if (nuevo < 10) nuevo = 10;
            if (saldoActual > 0 && nuevo > saldoActual) nuevo = saldoActual;
            input.value = nuevo;
        }

        function apuestaMaxima() {
            if (saldoActual <= 0) return alert('❌ No tienes saldo disponible.');
            RetroSFX.click();
            document.getElementById('bet-input').value = saldoActual;
        }

        function tirarSlot() {
            const btn = document.getElementById('btn-spin');
            const status = document.getElementById('ui-status');
            let apuesta = parseInt(document.getElementById('bet-input').value);

            if (isNaN(apuesta) || apuesta <= 0) return alert('Ingresa una apuesta válida.');
            if (apuesta > saldoActual) return alert('❌ FONDOS INSUFICIENTES.');

            btn.disabled = true;
            saldoActual -= apuesta;
            actualizarHUD();
            RetroSFX.giro();

            const reels = [
                document.getElementById('r1'),
                document.getElementById('r2'),
                document.getElementById('r3')
            ];

            reels.forEach(r => {
                r.classList.remove('winner');
                r.classList.add('spinning');
            });

            status.className = 'status-bar';
            status.innerText = 'GIRANDO...';

            setTimeout(async () => {
                const res = [
                    emojis[Math.floor(Math.random() * emojis.length)],
                    emojis[Math.floor(Math.random() * emojis.length)],
                    emojis[Math.floor(Math.random() * emojis.length)]
                ];

                reels.forEach((r, i) => {
                    r.classList.remove('spinning');
                    r.innerText = res[i];
                });

                let premio = 0;
                let esJackpot = false;

                if (res[0] === res[1] && res[1] === res[2]) {
                    esJackpot = true;
                    if (res[0] === '💎') premio = apuesta * 100;
                    else if (res[0] === '🍉') premio = apuesta * 50;
                    else premio = apuesta * 10;
                    reels.forEach(r => r.classList.add('winner'));
                } else if (res[0] === res[1] || res[1] === res[2] || res[0] === res[2]) {
                    premio = apuesta * 2;
                    if (res[0] === res[1]) { reels[0].classList.add('winner'); reels[1].classList.add('winner'); }
                    if (res[1] === res[2]) { reels[1].classList.add('winner'); reels[2].classList.add('winner'); }
                    if (res[0] === res[2]) { reels[0].classList.add('winner'); reels[2].classList.add('winner'); }
                }

                document.getElementById('ui-last-win').innerText = premio.toLocaleString();

                if (premio > 0) {
                    saldoActual += premio;
                    status.className = 'status-bar win';
                    status.innerText = `¡GANASTE +${premio.toLocaleString()} 🪙!`;
                    if (esJackpot) RetroSFX.jackpot();
                    else RetroSFX.ganar();
                } else {
                    totalPerdido += apuesta;
                    status.className = 'status-bar lose';
                    status.innerText = 'INTENTA DE NUEVO';
                    RetroSFX.perder();
                }

                actualizarHUD();
                await sincronizarSaldo();
                btn.disabled = false;
            }, 900);
        }
    </script>
</body>
</html>
