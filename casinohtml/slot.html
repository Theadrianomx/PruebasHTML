<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Citadel Deck C-137</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Press Start 2P', cursive; }

        body {
            background-image: url('https://i.postimg.cc/HntNcFZc/desktop.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: white;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            overflow-y: auto;
            padding: 20px 10px;
        }

        /* ---------------- PANTALLA DE REGISTRO ---------------- */
        #login-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(18, 2, 36, 0.95);
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            z-index: 100; backdrop-filter: blur(5px);
        }

        .login-box {
            background: #050505; padding: 30px; border: 4px solid #13eb2b;
            border-radius: 12px; text-align: center; box-shadow: 0 0 30px rgba(19, 235, 43, 0.4);
            width: 90%; max-width: 400px;
        }

        .login-box h2 { color: #13eb2b; font-size: 14px; margin-bottom: 20px; line-height: 1.5; }
        
        .input-group { margin-bottom: 15px; text-align: left; }
        .input-group label { font-size: 8px; color: #fcf003; margin-bottom: 5px; display: block; }
        .input-group input { 
            width: 100%; padding: 10px; background: #111; border: 2px solid #8a2be2; 
            color: white; font-family: 'Press Start 2P', cursive; font-size: 10px;
        }

        .btn-start {
            background: #13eb2b; color: #000; border: none; padding: 15px;
            width: 100%; font-size: 12px; margin-top: 10px; cursor: pointer; box-shadow: 0 5px 0 #0b8c18;
        }
        .btn-start:active { transform: translateY(5px); box-shadow: none; }

        /* ---------------- CONSOLA DE JUEGO ---------------- */
        #game-screen { display: none; flex-direction: column; align-items: center; width: 100%; max-width: 450px; }

        .header-title { color: #13eb2b; font-size: 18px; text-shadow: 0 0 8px #13eb2b; margin-bottom: 15px; text-align: center; }
        
        .machine-container {
            background: #050505; padding: 20px; border-radius: 8px;
            border: 3px solid #fcf003; box-shadow: 0 0 20px rgba(252, 240, 3, 0.3);
            margin-bottom: 20px;
        }

        .reels-board { display: flex; gap: 15px; }

        .reel {
            width: 70px; height: 90px; background: #1a1a1a; border: 2px solid #333;
            display: flex; justify-content: center; align-items: center;
            font-size: 45px; overflow: hidden; position: relative;
        }

        /* ---------------- TABLA DE PUNTOS Y APUESTAS ---------------- */
        .wallet-panel { display: flex; gap: 10px; width: 100%; margin-bottom: 20px; }
        .stat-box { flex: 1; background: rgba(0,0,0,0.8); border: 1px solid #8a2be2; padding: 10px; text-align: center; border-radius: 6px; }
        .stat-title { font-size: 7px; color: #13eb2b; margin-bottom: 8px; }
        .stat-value { font-size: 12px; color: #fcf003; }
        .lose-text { color: #ff3333 !important; }
        .win-text { color: #13eb2b !important; }

        .bet-panel {
            width: 100%; background: rgba(0,0,0,0.8); border: 1px solid #13eb2b;
            padding: 15px; border-radius: 6px; margin-bottom: 20px; text-align: center;
        }
        .bet-panel-title { font-size: 8px; color: #13eb2b; margin-bottom: 10px; }
        
        .bet-controls { display: flex; gap: 10px; justify-content: center; align-items: center; }
        .bet-controls select {
            padding: 10px; background: #111; border: 2px solid #8a2be2; color: #fff;
            font-family: 'Press Start 2P', cursive; font-size: 8px; cursor: pointer; flex: 1;
        }
        .bet-controls input {
            padding: 10px; background: #111; border: 2px solid #fcf003; color: #fff;
            font-family: 'Press Start 2P', cursive; font-size: 10px; flex: 1; width: 100%; text-align: center;
        }

        .controls { width: 100%; display: flex; justify-content: center; }
        .btn-spin {
            background: #fcf003; color: #000; border: none; padding: 15px 30px;
            font-size: 14px; border-radius: 50px; cursor: pointer;
            box-shadow: 0 6px 0 #b3a900; width: 100%;
        }
        .btn-spin:active { transform: translateY(6px); box-shadow: none; }
        .btn-spin:disabled { background: #555; box-shadow: 0 6px 0 #222; cursor: not-allowed; }
        
        .spinning { animation: shake 0.1s infinite; filter: blur(2px); }
        @keyframes shake { 0% { transform: translateY(0); } 50% { transform: translateY(-10px); } 100% { transform: translateY(0); } }
    </style>
</head>
<body>

    <!-- PANTALLA DE REGISTRO -->
    <div id="login-screen">
        <div class="login-box">
            <h2>CITADEL DECK<br>SYSTEM C-137</h2>
            <div class="input-group">
                <label>Número WhatsApp:</label>
                <input type="text" id="input-num" placeholder="Ej: 19016274924">
            </div>
            <div class="input-group">
                <label>Nombre:</label>
                <input type="text" id="input-name" placeholder="Tu Nombre">
            </div>
            <button class="btn-start" onclick="iniciarConsola()">ENTRAR A LA RED</button>
        </div>
    </div>

    <!-- CONSOLA DE JUEGO -->
    <div id="game-screen">
        <div class="header-title">CITADEL DECK</div>
        
        <div class="machine-container">
            <div class="reels-board">
                <div class="reel" id="r1">🍒</div>
                <div class="reel" id="r2">🍒</div>
                <div class="reel" id="r3">🍒</div>
            </div>
        </div>

        <!-- TABLA DE PUNTOS (Billetera) -->
        <div class="wallet-panel">
            <div class="stat-box">
                <div class="stat-title">DISPONIBLE</div>
                <div class="stat-value" id="ui-saldo">0</div>
            </div>
            <div class="stat-box">
                <div class="stat-title">YA PERDIDO</div>
                <div class="stat-value lose-text" id="ui-perdido">0</div>
            </div>
        </div>

        <!-- CONTROLES DE APUESTA (Menú + Input) -->
        <div class="bet-panel">
            <div class="bet-panel-title">CONFIGURAR APUESTA</div>
            <div class="bet-controls">
                <select id="bet-select" onchange="sincronizarApuesta()">
                    <option value="10">10 🪙</option>
                    <option value="50" selected>50 🪙</option>
                    <option value="100">100 🪙</option>
                    <option value="500">500 🪙</option>
                    <option value="ALL">ALL IN</option>
                    <option value="CUSTOM">Escribir...</option>
                </select>
                <input type="number" id="bet-input" value="50" oninput="marcarApuestaManual()">
            </div>
        </div>

        <div class="controls">
            <button class="btn-spin" id="btn-spin" onclick="tirarSlot()">🎰 GIRAR</button>
        </div>
    </div>

    <script>
        let userData = { numero: '', nombre: '' };
        let saldoActual = 0;
        let totalPerdido = 0;
        const emojis = ['🍒', '🍊', '🍉', '🍇', '💎'];

        // Al cargar la página, leer URL
        window.onload = () => {
            const params = new URLSearchParams(window.location.search);
            if(params.get('num')) document.getElementById('input-num').value = params.get('num');
            if(params.get('user')) document.getElementById('input-name').value = params.get('user');
            
            // Cargar saldo enviado por el bot
            saldoActual = parseInt(params.get('cr')) || 0;
            document.getElementById('ui-saldo').innerText = saldoActual;
        };

        // Función del Botón ENTRAR
        function iniciarConsola() {
            userData.numero = document.getElementById('input-num').value;
            userData.nombre = document.getElementById('input-name').value || 'Jugador';
            
            if(!userData.numero) return alert('Debes ingresar tu número para guardar progreso.');

            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('game-screen').style.display = 'flex';
        }

        // --- SISTEMA DE APUESTAS ---
        function sincronizarApuesta() {
            const selectVal = document.getElementById('bet-select').value;
            const inputVal = document.getElementById('bet-input');
            
            if (selectVal === 'ALL') {
                inputVal.value = saldoActual; // Apuesta todo el saldo
            } else if (selectVal !== 'CUSTOM') {
                inputVal.value = selectVal;
            }
        }

        function marcarApuestaManual() {
            // Si el usuario escribe manualmente, el selector cambia a "Escribir..."
            document.getElementById('bet-select').value = 'CUSTOM';
        }

        // --- MOTOR DEL JUEGO ---
        function tirarSlot() {
            const btn = document.getElementById('btn-spin');
            const inputApuesta = document.getElementById('bet-input');
            let apuesta = parseInt(inputApuesta.value);

            // Validaciones de dinero
            if (isNaN(apuesta) || apuesta <= 0) return alert('Ingresa una apuesta válida.');
            if (apuesta > saldoActual) return alert('❌ FONDOS INSUFICIENTES. No puedes apostar más de lo que tienes.');

            // Cobrar apuesta y actualizar UI inmediatamente
            btn.disabled = true;
            saldoActual -= apuesta;
            document.getElementById('ui-saldo').innerText = saldoActual;
            
            const r1 = document.getElementById('r1');
            const r2 = document.getElementById('r2');
            const r3 = document.getElementById('r3');
            
            r1.classList.add('spinning');
            r2.classList.add('spinning');
            r3.classList.add('spinning');

            setTimeout(() => {
                r1.classList.remove('spinning'); r2.classList.remove('spinning'); r3.classList.remove('spinning');
                
                const res1 = emojis[Math.floor(Math.random() * emojis.length)];
                const res2 = emojis[Math.floor(Math.random() * emojis.length)];
                const res3 = emojis[Math.floor(Math.random() * emojis.length)];
                
                r1.innerText = res1; r2.innerText = res2; r3.innerText = res3;

                let premioGanado = 0;
                if (res1 === res2 && res2 === res3) {
                    if (res1 === '💎') premioGanado = apuesta * 100;
                    else if (res1 === '🍉') premioGanado = apuesta * 50;
                    else premioGanado = apuesta * 10;
                } else if (res1 === res2 || res2 === res3 || res1 === res3) {
                    premioGanado = apuesta * 2;
                }

                // Actualizar Tabla de Puntos
                if (premioGanado === 0) {
                    totalPerdido += apuesta;
                    document.getElementById('ui-perdido').innerText = totalPerdido;
                } else {
                    saldoActual += premioGanado;
                    document.getElementById('ui-saldo').innerText = saldoActual;
                    document.getElementById('ui-saldo').classList.add('win-text');
                    setTimeout(() => document.getElementById('ui-saldo').classList.remove('win-text'), 1000);
                }
                
                // Informar al bot en Termux (Webhook)
                enviarResultadosAlBot(userData.numero, apuesta, premioGanado, saldoActual);

                btn.disabled = false;
            }, 1000);
        }

        // Enviar actualización en vivo al JSON del bot
        async function enviarResultadosAlBot(numero, apuesta, ganancia, saldoRestante) {
            const urlDeTuAPI = 'https://TU_TUNEL_CLOUDFLARE.com/api/slot'; // Cambia esto por tu servidor Express
            try {
                await fetch(urlDeTuAPI, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ numero, apuesta, premio: ganancia, saldo: saldoRestante })
                });
            } catch (err) {
                console.log('Error de sincronización:', err);
            }
        }
    </script>
</body>
</html>
