<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=400, height=260, initial-scale=1.0">
    <title>Citadel Deck C-137 - Slot</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            width: 400px;
            height: 260px;
            /* Fondo Morado Oscuro Espacial */
            background: linear-gradient(135deg, #2b0f4c 0%, #120224 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            font-family: 'Press Start 2P', cursive;
            /* Borde Exterior Verde Portal */
            border: 4px solid #13eb2b;
            border-radius: 12px;
            box-shadow: inset 0 0 25px rgba(19, 235, 43, 0.3);
            color: white;
            padding-top: 12px;
            overflow: hidden;
        }

        /* Logotipo de la Consola */
        .header {
            text-align: center;
            margin-bottom: 12px;
        }
        
        .header-title {
            color: #13eb2b; /* Verde Portal */
            font-size: 15px;
            text-shadow: 0 0 8px #13eb2b, 2px 2px 0px #000;
            margin-bottom: 5px;
            letter-spacing: -1px;
        }
        
        .header-subtitle {
            color: #fcf003; /* Amarillo Morty */
            font-size: 6px;
            letter-spacing: 1px;
            text-shadow: 1px 1px 0px #000;
        }

        /* Mini Tabla de Pagos */
        .paytable {
            display: flex;
            gap: 15px;
            margin-bottom: 15px;
            background: rgba(0, 0, 0, 0.6);
            padding: 6px 15px;
            border-radius: 6px;
            border: 1px solid #8a2be2; /* Borde Morado Neón */
        }

        .pay-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            font-size: 7px;
            color: #ddd;
        }

        .pay-item span {
            font-size: 13px;
            margin-bottom: 3px;
        }

        /* Pantalla Principal del Tragamonedas */
        .machine-container {
            background: #050505;
            padding: 10px 20px;
            border-radius: 8px;
            border: 2px solid #fcf003; /* Borde Amarillo */
            box-shadow: 0 0 15px rgba(252, 240, 3, 0.3);
        }

        .reels-board {
            display: flex;
            gap: 12px;
        }

        .reel {
            width: 55px;
            height: 75px;
            background: #1a1a1a;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 35px;
            border: 2px solid #333;
            box-shadow: inset 0 0 10px #000;
        }

        /* Efecto cuando ganas (Brillo Verde Portal) */
        .reel.winner {
            border: 2px solid #13eb2b;
            box-shadow: 0 0 15px #13eb2b, inset 0 0 10px rgba(19, 235, 43, 0.2);
            background: #0a240f;
        }

        /* Pantallas de Datos Inferiores */
        .stats-panel {
            display: flex;
            justify-content: space-between;
            width: 92%;
            margin-top: 15px;
            gap: 8px;
        }

        .stat-box {
            background: rgba(0, 0, 0, 0.8);
            padding: 8px;
            border-radius: 4px;
            text-align: center;
            border: 1px solid #8a2be2; /* Borde Morado */
            flex: 1;
        }

        .stat-title {
            font-size: 6px;
            color: #13eb2b; /* Títulos en Verde Portal */
            margin-bottom: 5px;
        }

        .stat-value {
            font-size: 10px;
            color: #fcf003; /* Números en Amarillo Morty */
        }

        .win-text {
            color: #13eb2b !important;
            text-shadow: 0 0 5px #13eb2b;
        }
        
        .lose-text {
            color: #ff3333 !important;
        }
    </style>
</head>
<body>

    <div class="header">
        <div class="header-title">CITADEL DECK</div>
        <div class="header-subtitle">SYSTEM C-137 • EVIL MORTY OS</div>
    </div>

    <div class="paytable">
        <div class="pay-item"><span>💎</span>x100</div>
        <div class="pay-item"><span>🍉</span>x50</div>
        <div class="pay-item"><span>🍇</span>x20</div>
        <div class="pay-item"><span>🍊</span>x10</div>
        <div class="pay-item"><span>🍒</span>x5</div>
    </div>

    <div class="machine-container">
        <div class="reels-board">
            <div class="reel" id="slot1">❔</div>
            <div class="reel" id="slot2">❔</div>
            <div class="reel" id="slot3">❔</div>
        </div>
    </div>

    <div class="stats-panel">
        <div class="stat-box">
            <div class="stat-title">SALDO</div>
            <div class="stat-value" id="credito">0</div>
        </div>
        <div class="stat-box">
            <div class="stat-title">APUESTA</div>
            <div class="stat-value" id="apuesta">50</div>
        </div>
        <div class="stat-box">
            <div class="stat-title">PREMIO</div>
            <div class="stat-value" id="ganado">0</div>
        </div>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const s1 = params.get('s1') || '❔';
        const s2 = params.get('s2') || '❔';
        const s3 = params.get('s3') || '❔';
        const credito = params.get('cr') || '0';
        const apuesta = params.get('ap') || '50';
        const premio = parseInt(params.get('gan') || '0');

        document.getElementById('slot1').innerText = s1;
        document.getElementById('slot2').innerText = s2;
        document.getElementById('slot3').innerText = s3;
        document.getElementById('credito').innerText = credito;
        document.getElementById('apuesta').innerText = apuesta;
        
        const ganadoElem = document.getElementById('ganado');
        ganadoElem.innerText = premio > 0 ? `+${premio}` : '0';

        if (premio > 0) {
            ganadoElem.classList.add('win-text');
            // Iluminar rodillos ganadores con el Verde Portal
            if (s1 === s2) { document.getElementById('slot1').classList.add('winner'); document.getElementById('slot2').classList.add('winner'); }
            if (s2 === s3) { document.getElementById('slot2').classList.add('winner'); document.getElementById('slot3').classList.add('winner'); }
            if (s1 === s3) { document.getElementById('slot1').classList.add('winner'); document.getElementById('slot3').classList.add('winner'); }
        } else if (params.has('s1')) {
            ganadoElem.classList.add('lose-text');
        }
    </script>
</body>
</html>
