<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Space Cruiser C-137 • Rick & Morty</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700&family=Orbitron:wght@700;900&display=swap');

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: #05020d;
            color: #fff;
            font-family: 'Chakra Petch', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 8px;
            overflow: hidden;
        }

        /* ================= PANTALLA DE REGISTRO ================= */
        #login-screen {
            position: fixed;
            inset: 0;
            background: radial-gradient(circle at center, rgba(20, 45, 30, 0.96), rgba(5, 2, 13, 0.99));
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 999;
            padding: 20px;
            backdrop-filter: blur(8px);
        }

        .login-card {
            width: 100%;
            max-width: 380px;
            background: linear-gradient(180deg, #101f1b 0%, #070b14 100%);
            border: 3px solid #39ff14;
            border-radius: 18px;
            padding: 24px 20px;
            box-shadow: 0 0 30px rgba(57, 255, 20, 0.35);
            text-align: center;
        }

        .login-card h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 20px;
            color: #39ff14;
            text-shadow: 0 0 12px rgba(57, 255, 20, 0.8);
            margin-bottom: 4px;
        }

        .login-card p {
            font-size: 11px;
            color: #00e5ff;
            letter-spacing: 2px;
            margin-bottom: 18px;
        }

        .field {
            text-align: left;
            margin-bottom: 14px;
        }

        .field label {
            display: block;
            font-size: 11px;
            color: #a7f3d0;
            margin-bottom: 6px;
            text-transform: uppercase;
        }

        .field input {
            width: 100%;
            padding: 12px 14px;
            border-radius: 10px;
            border: 2px solid #00e5ff;
            background: #050a14;
            color: #fff;
            font-family: 'Orbitron', sans-serif;
            font-size: 14px;
            outline: none;
        }

        .btn-enter {
            width: 100%;
            margin-top: 8px;
            padding: 14px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(180deg, #39ff14 0%, #0ea81f 100%);
            color: #021a04;
            font-family: 'Orbitron', sans-serif;
            font-weight: 900;
            font-size: 15px;
            cursor: pointer;
            box-shadow: 0 5px 0 #075c11;
        }

        /* ================= CONTENEDOR DEL JUEGO ================= */
        #game-screen {
            display: none;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 440px;
            gap: 8px;
        }

        .top-hud {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #0c1226;
            border: 2px solid #39ff14;
            border-radius: 12px;
            padding: 6px 10px;
            box-shadow: 0 0 12px rgba(57, 255, 20, 0.2);
        }

        .hud-left {
            display: flex;
            flex-direction: column;
        }

        .player-name {
            font-size: 12px;
            font-weight: 700;
            color: #fff;
        }

        .saldo-txt {
            font-family: 'Orbitron', sans-serif;
            font-size: 12px;
            color: #ffd700;
            font-weight: 900;
        }

        .hud-right {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .btn-mute {
            width: 30px;
            height: 30px;
            border-radius: 8px;
            background: #050a14;
            border: 1.5px solid #00e5ff;
            color: #fff;
            font-size: 14px;
            cursor: pointer;
        }

        .sync-badge {
            background: linear-gradient(180deg, #25d366 0%, #128c7e 100%);
            border: 1.5px solid #b8ffcb;
            border-radius: 8px;
            color: #fff;
            font-weight: 700;
            font-size: 9.5px;
            padding: 5px 7px;
        }

        /* Marcador en partida */
        .run-stats {
            width: 100%;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        .stat-pill {
            background: #0c1226;
            border: 1.5px solid #00e5ff;
            border-radius: 10px;
            padding: 5px 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 11px;
            color: #94a3b8;
        }

        .stat-pill b {
            font-family: 'Orbitron', sans-serif;
            font-size: 14px;
            color: #39ff14;
        }

        /* Lienzo 2D */
        .canvas-wrap {
            position: relative;
            width: 100%;
            aspect-ratio: 3 / 4;
            max-height: 68vh;
            border-radius: 16px;
            border: 3px solid #00e5ff;
            overflow: hidden;
            box-shadow: 0 0 25px rgba(0, 229, 255, 0.3);
            background: #040712;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            touch-action: none;
        }

        /* Overlay de inicio / Game Over */
        #canvas-overlay {
            position: absolute;
            inset: 0;
            background: rgba(5, 8, 20, 0.82);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px;
            gap: 12px;
            backdrop-filter: blur(4px);
        }

        .ov-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 22px;
            font-weight: 900;
            color: #39ff14;
            text-shadow: 0 0 12px rgba(57, 255, 20, 0.8);
        }

        .ov-sub {
            font-size: 13px;
            color: #e2e8f0;
            line-height: 1.4;
            max-width: 280px;
        }

        .ov-loot {
            font-family: 'Orbitron', sans-serif;
            font-size: 16px;
            color: #ffd700;
            background: rgba(0, 0, 0, 0.6);
            border: 1.5px solid #ffd700;
            padding: 6px 14px;
            border-radius: 10px;
            display: none;
        }

        .btn-launch {
            padding: 14px 28px;
            border: none;
            border-radius: 14px;
            background: linear-gradient(180deg, #39ff14 0%, #15803d 100%);
            color: #022c22;
            font-family: 'Orbitron', sans-serif;
            font-weight: 900;
            font-size: 15px;
            letter-spacing: 1px;
            cursor: pointer;
            box-shadow: 0 5px 0 #052e16, 0 0 18px rgba(57, 255, 20, 0.45);
        }

        .btn-launch:active {
            transform: translateY(3px);
            box-shadow: none;
        }

        .hint-bar {
            font-size: 11px;
            color: #94a3b8;
            text-align: center;
        }

        .hint-bar b {
            color: #00e5ff;
        }
    </style>
</head>
<body>

    <!-- PANTALLA DE REGISTRO -->
    <div id="login-screen">
        <div class="login-card">
            <h1>SPACE CRUISER C-137</h1>
            <p>RICK & MORTY • FÍSICAS 2D</p>
            <div class="field">
                <label>Número WhatsApp</label>
                <input type="text" id="input-num" placeholder="Ej: 19016274924">
            </div>
            <div class="field">
                <label>Piloto</label>
                <input type="text" id="input-name" placeholder="Tu Nombre">
            </div>
            <button class="btn-enter" onclick="iniciarConsola()">SUBIR A LA NAVE</button>
        </div>
    </div>

    <!-- PANTALLA PRINCIPAL -->
    <div id="game-screen">

        <div class="top-hud">
            <div class="hud-left">
                <span class="player-name">🛸 <span id="ui-player">Rick</span></span>
                <span class="saldo-txt">🪙 <span id="ui-saldo">0</span></span>
            </div>
            <div class="hud-right">
                <button class="btn-mute" id="btn-mute" onclick="toggleSonido()">🔊</button>
                <div class="sync-badge" id="ui-sync">⏳ SYNC</div>
            </div>
        </div>

        <div class="run-stats">
            <div class="stat-pill">BOTÍN <b id="ui-botin">+0</b></div>
            <div class="stat-pill">DISTANCIA <b id="ui-dist">0m</b></div>
        </div>

        <div class="canvas-wrap">
            <canvas id="gameCanvas" width="360" height="480"></canvas>

            <div id="canvas-overlay">
                <div class="ov-title" id="ov-title">SPACE CRUISER</div>
                <div class="ov-sub" id="ov-sub">
                    Mantén presionada la pantalla para activar los propulsores.<br><br>
                    🌰 Mega Semilla: <b>+25 🪙</b><br>
                    💎 Cristal Kalaxiano: <b>+60 🪙</b>
                </div>
                <div class="ov-loot" id="ov-loot"></div>
                <button class="btn-launch" id="btn-launch" onclick="despegar()">DESPEGAR (50 🪙)</button>
            </div>
        </div>

        <div class="hint-bar">
            <b>MANTÉN PRESIONADO</b> para subir • <b>SUELTA</b> para caer
        </div>

    </div>

    <script>
        const API_URL = 'https://casino.curvainfinitacentral.com';
        const COSTO_DESPEGUE = 50;

        let userData = { numero: '', nombre: '' };
        let saldoActual = 0;

        /* ================= MOTOR DE AUDIO RETRO 8-BIT ================= */
        const RetroSFX = (() => {
            let ctx = null;
            let silenciado = false;

            function init() {
                if (!ctx) {
                    const AudioCtx = window.AudioContext || window.webkitAudioContext;
                    ctx = new AudioCtx();
                }
                if (ctx.state === 'suspended') ctx.resume();
            }

            function tono(freq, dur, tipo = 'square', vol = 0.06, delay = 0) {
                if (silenciado) return;
                init();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                const t = ctx.currentTime + delay;
                osc.type = tipo;
                osc.frequency.setValueAtTime(freq, t);
                gain.gain.setValueAtTime(vol, t);
                gain.gain.exponentialRampToValueAtTime(0.001, t + dur);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start(t);
                osc.stop(t + dur);
            }

            return {
                toggleMute() { silenciado = !silenciado; return silenciado; },
                propulsor() { tono(140, 0.05, 'sawtooth', 0.035); },
                semilla() {
                    tono(660, 0.06, 'square', 0.07, 0);
                    tono(990, 0.1, 'square', 0.07, 0.05);
                },
                cristal() {
                    [587, 880, 1174].forEach((n, i) => tono(n, 0.09, 'square', 0.08, i * 0.06));
                },
                choque() {
                    tono(160, 0.15, 'sawtooth', 0.1, 0);
                    tono(90, 0.3, 'sawtooth', 0.1, 0.12);
                }
            };
        })();

        function toggleSonido() {
            const muted = RetroSFX.toggleMute();
            document.getElementById('btn-mute').innerText = muted ? '🔇' : '🔊';
        }

        /* ================= SINCRONIZACIÓN CON SERVIDOR ================= */
        window.onload = () => {
            const params = new URLSearchParams(window.location.search);
            if (params.get('num')) document.getElementById('input-num').value = params.get('num');
            if (params.get('user')) document.getElementById('input-name').value = params.get('user');
            saldoActual = parseInt(params.get('cr')) || 0;
            actualizarHUD();
            dibujarEscenaInicial();
        };

        function actualizarHUD() {
            document.getElementById('ui-saldo').innerText = saldoActual.toLocaleString();
        }

        function setSyncEstado(texto, color) {
            const el = document.getElementById('ui-sync');
            el.innerText = texto;
            el.style.background = color;
        }

        async function iniciarConsola() {
            userData.numero = document.getElementById('input-num').value.replace(/[^0-9]/g, '');
            userData.nombre = document.getElementById('input-name').value.trim() || 'Rick';
            if (!userData.numero) return alert('Debes ingresar tu número.');

            document.getElementById('ui-player').innerText = userData.nombre;
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('game-screen').style.display = 'flex';

            try {
                setSyncEstado('⏳ SYNC...', '#d97706');
                const res = await fetch(`${API_URL}/api/saldo/${userData.numero}`);
                const data = await res.json();
                if (data.ok && data.saldo !== undefined) {
                    saldoActual = Number(data.saldo);
                    actualizarHUD();
                    setSyncEstado('🟢 EN VIVO', 'linear-gradient(180deg, #25d366 0%, #128c7e 100%)');
                }
            } catch (e) {
                setSyncEstado('🔴 OFFLINE', '#b31222');
            }
        }

        async function sincronizarSaldo() {
            try {
                setSyncEstado('⏳ GUARDANDO', '#d97706');
                const res = await fetch(`${API_URL}/api/slot`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ numero: userData.numero, saldo: saldoActual })
                });
                const data = await res.json();
                if (data.ok) {
                    setSyncEstado('🟢 EN VIVO', 'linear-gradient(180deg, #25d366 0%, #128c7e 100%)');
                }
            } catch (e) {
                setSyncEstado('🔴 ERROR', '#b31222');
            }
        }

        /* ================= MOTOR 2D CON FÍSICAS ================= */
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const W = canvas.width;
        const H = canvas.height;

        let jugando = false;
        let presionando = false;
        let frame = 0;
        let botin = 0;
        let distancia = 0;
        let velocidad = 2.8;

        const nave = { x: 82, y: H / 2, vy: 0, radio: 18 };
        const GRAVEDAD = 0.28;
        const EMPUJE = -0.62;

        let estrellas = Array.from({ length: 45 }, () => ({
            x: Math.random() * W,
            y: Math.random() * H,
            r: Math.random() * 1.8 + 0.5,
            s: Math.random() * 1.5 + 0.4
        }));

        let obstaculos = [];
        let premios = [];
        let particulas = [];

        // Controles táctiles y de teclado
        function setEmpuje(estado, e) {
            if (e) e.preventDefault();
            presionando = estado;
        }

        canvas.addEventListener('touchstart', (e) => setEmpuje(true, e), { passive: false });
        canvas.addEventListener('touchend', (e) => setEmpuje(false, e), { passive: false });
        canvas.addEventListener('mousedown', () => setEmpuje(true));
        window.addEventListener('mouseup', () => setEmpuje(false));
        window.addEventListener('keydown', (e) => { if (e.code === 'Space') setEmpuje(true, e); });
        window.addEventListener('keyup', (e) => { if (e.code === 'Space') setEmpuje(false, e); });

        function crearParticulas(x, y, color, cantidad = 10, vel = 3) {
            for (let i = 0; i < cantidad; i++) {
                const ang = Math.random() * Math.PI * 2;
                const sp = Math.random() * vel + 0.5;
                particulas.push({
                    x, y,
                    vx: Math.cos(ang) * sp,
                    vy: Math.sin(ang) * sp,
                    vida: 1,
                    color,
                    r: Math.random() * 3.5 + 1.5
                });
            }
        }

        function despegar() {
            if (saldoActual < COSTO_DESPEGUE) {
                return alert(`❌ Necesitas al menos ${COSTO_DESPEGUE} 🪙 para despegar.`);
            }

            saldoActual -= COSTO_DESPEGUE;
            actualizarHUD();
            sincronizarSaldo();

            nave.y = H / 2;
            nave.vy = 0;
            obstaculos = [];
            premios = [];
            particulas = [];
            botin = 0;
            distancia = 0;
            velocidad = 2.8;
            frame = 0;
            presionando = false;
            jugando = true;

            document.getElementById('ui-botin').innerText = '+0';
            document.getElementById('ui-dist').innerText = '0m';
            document.getElementById('canvas-overlay').style.display = 'none';

            requestAnimationFrame(loop);
        }

        async function terminarPartida() {
            jugando = false;
            RetroSFX.choque();
            crearParticulas(nave.x, nave.y, '#39ff14', 24, 5);
            crearParticulas(nave.x, nave.y, '#ff4757', 18, 4);

            saldoActual += botin;
            actualizarHUD();
            await sincronizarSaldo();

            const overlay = document.getElementById('canvas-overlay');
            const lootBox = document.getElementById('ov-loot');
            document.getElementById('ov-title').innerText = '¡NAVE DESTRUIDA!';
            document.getElementById('ov-sub').innerText = `Distancia recorrida: ${Math.floor(distancia)}m`;
            lootBox.style.display = 'block';
            lootBox.innerText = `BOTÍN COBRADO: +${botin.toLocaleString()} 🪙`;
            document.getElementById('btn-launch').innerText = `VOLAR DE NUEVO (${COSTO_DESPEGUE} 🪙)`;
            overlay.style.display = 'flex';
        }

        function dibujarNave() {
            ctx.save();
            ctx.translate(nave.x, nave.y);
            ctx.rotate(Math.max(-0.35, Math.min(0.45, nave.vy * 0.06)));

            // Llama verde de propulsor
            if (presionando) {
                ctx.fillStyle = '#39ff14';
                ctx.beginPath();
                ctx.moveTo(-18, 4);
                ctx.lineTo(-32 - Math.random() * 10, 0);
                ctx.lineTo(-18, -4);
                ctx.fill();
            }

            // Cúpula de vidrio (cabina)
            ctx.fillStyle = 'rgba(0, 229, 255, 0.75)';
            ctx.beginPath();
            ctx.arc(0, -6, 13, Math.PI, 0);
            ctx.fill();

            // Silueta del pelo de Rick dentro
            ctx.fillStyle = '#a5f3fc';
            ctx.beginPath();
            ctx.arc(-2, -9, 5, 0, Math.PI * 2);
            ctx.fill();

            // Cuerpo metálico del Space Cruiser
            ctx.fillStyle = '#94a3b8';
            ctx.beginPath();
            ctx.ellipse(0, 0, 22, 9, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = '#334155';
            ctx.lineWidth =
