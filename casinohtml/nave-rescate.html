<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Space Cruiser C-137 • Primera Persona</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700&family=Orbitron:wght@700;900&display=swap');

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: #04020a;
            color: #fff;
            font-family: 'Chakra Petch', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 8px;
            overflow: hidden;
        }

        /* ================= PANTALLA DE REGISTRO ================= */
        #login-screen {
            position: fixed;
            inset: 0;
            background: radial-gradient(circle at center, rgba(16, 48, 32, 0.96), rgba(4, 2, 10, 0.99));
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 999;
            padding: 20px;
            backdrop-filter: blur(8px);
        }

        .login-card {
            width: 100%;
            max-width: 380px;
            background: linear-gradient(180deg, #101f1b 0%, #070b14 100%);
            border: 3px solid #39ff14;
            border-radius: 18px;
            padding: 24px 20px;
            box-shadow: 0 0 30px rgba(57, 255, 20, 0.35);
            text-align: center;
        }

        .login-card h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 20px;
            color: #39ff14;
            text-shadow: 0 0 12px rgba(57, 255, 20, 0.8);
            margin-bottom: 4px;
        }

        .login-card p {
            font-size: 11px;
            color: #00e5ff;
            letter-spacing: 2px;
            margin-bottom: 18px;
        }

        .field {
            text-align: left;
            margin-bottom: 14px;
        }

        .field label {
            display: block;
            font-size: 11px;
            color: #a7f3d0;
            margin-bottom: 6px;
            text-transform: uppercase;
        }

        .field input {
            width: 100%;
            padding: 12px 14px;
            border-radius: 10px;
            border: 2px solid #00e5ff;
            background: #050a14;
            color: #fff;
            font-family: 'Orbitron', sans-serif;
            font-size: 14px;
            outline: none;
        }

        .btn-enter {
            width: 100%;
            margin-top: 8px;
            padding: 14px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(180deg, #39ff14 0%, #0ea81f 100%);
            color: #021a04;
            font-family: 'Orbitron', sans-serif;
            font-weight: 900;
            font-size: 15px;
            cursor: pointer;
            box-shadow: 0 5px 0 #075c11;
        }

        /* ================= CONTENEDOR DEL JUEGO ================= */
        #game-screen {
            display: none;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 440px;
            gap: 8px;
        }

        .top-hud {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #0c1226;
            border: 2px solid #39ff14;
            border-radius: 12px;
            padding: 6px 10px;
            box-shadow: 0 0 12px rgba(57, 255, 20, 0.2);
        }

        .hud-left {
            display: flex;
            flex-direction: column;
        }

        .player-name {
            font-size: 12px;
            font-weight: 700;
            color: #fff;
        }

        .saldo-txt {
            font-family: 'Orbitron', sans-serif;
            font-size: 12px;
            color: #ffd700;
            font-weight: 900;
        }

        .hud-right {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .btn-mute {
            width: 30px;
            height: 30px;
            border-radius: 8px;
            background: #050a14;
            border: 1.5px solid #00e5ff;
            color: #fff;
            font-size: 14px;
            cursor: pointer;
        }

        .sync-badge {
            background: linear-gradient(180deg, #25d366 0%, #128c7e 100%);
            border: 1.5px solid #b8ffcb;
            border-radius: 8px;
            color: #fff;
            font-weight: 700;
            font-size: 9.5px;
            padding: 5px 7px;
        }

        .run-stats {
            width: 100%;
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 6px;
        }

        .stat-pill {
            background: #0c1226;
            border: 1.5px solid #00e5ff;
            border-radius: 10px;
            padding: 5px 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            font-size: 9px;
            color: #94a3b8;
        }

        .stat-pill b {
            font-family: 'Orbitron', sans-serif;
            font-size: 13px;
            color: #39ff14;
        }

        .canvas-wrap {
            position: relative;
            width: 100%;
            aspect-ratio: 3 / 4;
            max-height: 68vh;
            border-radius: 16px;
            border: 3px solid #00e5ff;
            overflow: hidden;
            box-shadow: 0 0 25px rgba(0, 229, 255, 0.35);
            background: #02040a;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            touch-action: none;
        }

        #canvas-overlay {
            position: absolute;
            inset: 0;
            background: rgba(4, 7, 18, 0.85);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px;
            gap: 12px;
            backdrop-filter: blur(4px);
        }

        .ov-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 20px;
            font-weight: 900;
            color: #39ff14;
            text-shadow: 0 0 12px rgba(57, 255, 20, 0.8);
        }

        .ov-sub {
            font-size: 12.5px;
            color: #e2e8f0;
            line-height: 1.45;
            max-width: 290px;
        }

        .ov-loot {
            font-family: 'Orbitron', sans-serif;
            font-size: 15px;
            color: #ffd700;
            background: rgba(0, 0, 0, 0.65);
            border: 1.5px solid #ffd700;
            padding: 6px 14px;
            border-radius: 10px;
            display: none;
        }

        .btn-launch {
            padding: 14px 26px;
            border: none;
            border-radius: 14px;
            background: linear-gradient(180deg, #39ff14 0%, #15803d 100%);
            color: #022c22;
            font-family: 'Orbitron', sans-serif;
            font-weight: 900;
            font-size: 14px;
            letter-spacing: 1px;
            cursor: pointer;
            box-shadow: 0 5px 0 #052e16, 0 0 18px rgba(57, 255, 20, 0.45);
        }

        .btn-launch:active {
            transform: translateY(3px);
            box-shadow: none;
        }

        .hint-bar {
            font-size: 11px;
            color: #94a3b8;
            text-align: center;
        }

        .hint-bar b {
            color: #00e5ff;
        }
    </style>
</head>
<body>

    <!-- PANTALLA DE REGISTRO -->
    <div id="login-screen">
        <div class="login-card">
            <h1>CABINA C-137</h1>
            <p>SPACE CRUISER • PRIMERA PERSONA</p>
            <div class="field">
                <label>Número WhatsApp</label>
                <input type="text" id="input-num" placeholder="Ej: 19016274924">
            </div>
            <div class="field">
                <label>Piloto</label>
                <input type="text" id="input-name" placeholder="Tu Nombre">
            </div>
            <button class="btn-enter" onclick="iniciarConsola()">ENTRAR A LA CABINA</button>
        </div>
    </div>

    <!-- PANTALLA PRINCIPAL -->
    <div id="game-screen">

        <div class="top-hud">
            <div class="hud-left">
                <span class="player-name">🛸 <span id="ui-player">Rick</span></span>
                <span class="saldo-txt">🪙 <span id="ui-saldo">0</span></span>
            </div>
            <div class="hud-right">
                <button class="btn-mute" id="btn-mute" onclick="toggleSonido()">🔊</button>
                <div class="sync-badge" id="ui-sync">⏳ SYNC</div>
            </div>
        </div>

        <div class="run-stats">
            <div class="stat-pill">BOTÍN <b id="ui-botin">+0</b></div>
            <div class="stat-pill">ESCUDOS <b id="ui-escudos">🟩🟩🟩</b></div>
            <div class="stat-pill">BAJAS <b id="ui-bajas">0</b></div>
        </div>

        <div class="canvas-wrap">
            <canvas id="gameCanvas" width="360" height="480"></canvas>

            <div id="canvas-overlay">
                <div class="ov-title" id="ov-title">CABINA C-137</div>
                <div class="ov-sub" id="ov-sub">
                    Arrastra el dedo para pilotar y disparar los cañones láser.<br><br>
                    🛸 Dron Enemigo: <b>+30 🪙</b><br>
                    🌰 Mega Semilla: <b>+25 🪙</b><br>
                    💎 Cristal: <b>+60 🪙</b>
                </div>
                <div class="ov-loot" id="ov-loot"></div>
                <button class="btn-launch" id="btn-launch" onclick="despegar()">DESPEGAR (50 🪙)</button>
            </div>
        </div>

        <div class="hint-bar">
            <b>DESLIZA</b> para esquivar y apuntar • <b>DISPARO AUTOMÁTICO</b>
        </div>

    </div>

    <script>
        const API_URL = 'https://casino.curvainfinitacentral.com';
        const COSTO_DESPEGUE = 50;

        let userData = { numero: '', nombre: '' };
        let saldoActual = 0;

        /* ================= MOTOR DE AUDIO RETRO 8-BIT ================= */
        const RetroSFX = (() => {
            let ctx = null;
            let silenciado = false;

            function init() {
                if (!ctx) {
                    const AudioCtx = window.AudioContext || window.webkitAudioContext;
                    ctx = new AudioCtx();
                }
                if (ctx.state === 'suspended') ctx.resume();
            }

            function tono(freq, dur, tipo = 'square', vol = 0.06, delay = 0) {
                if (silenciado) return;
                init();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                const t = ctx.currentTime + delay;
                osc.type = tipo;
                osc.frequency.setValueAtTime(freq, t);
                gain.gain.setValueAtTime(vol, t);
                gain.gain.exponentialRampToValueAtTime(0.001, t + dur);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start(t);
                osc.stop(t + dur);
            }

            return {
                toggleMute() { silenciado = !silenciado; return silenciado; },
                laser() { tono(880, 0.05, 'sawtooth', 0.04); tono(440, 0.06, 'square', 0.03, 0.02); },
                explosion() { tono(150, 0.12, 'sawtooth', 0.09); tono(75, 0.2, 'square', 0.08, 0.07); },
                botin() { tono(700, 0.06, 'square', 0.07); tono(1100, 0.1, 'square', 0.07, 0.05); },
                dano() { tono(220, 0.15, 'sawtooth', 0.12); tono(110, 0.25, 'sawtooth', 0.12, 0.12); }
            };
        })();

        function toggleSonido() {
            const muted = RetroSFX.toggleMute();
            document.getElementById('btn-mute').innerText = muted ? '🔇' : '🔊';
        }

        function actualizarHUD() {
            document.getElementById('ui-saldo').innerText = saldoActual.toLocaleString();
        }

        function actualizarEscudosUI() {
            document.getElementById('ui-escudos').innerText = '🟩'.repeat(escudos) + '⬛'.repeat(3 - escudos);
        }

        function setSyncEstado(texto, color) {
            const el = document.getElementById('ui-sync');
            el.innerText = texto;
            el.style.background = color;
        }

        async function iniciarConsola() {
            userData.numero = document.getElementById('input-num').value.replace(/[^0-9]/g, '');
            userData.nombre = document.getElementById('input-name').value.trim() || 'Rick';
            if (!userData.numero) return alert('Debes ingresar tu número.');

            document.getElementById('ui-player').innerText = userData.nombre;
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('game-screen').style.display = 'flex';

            try {
                setSyncEstado('⏳ SYNC...', '#d97706');
                const res = await fetch(`${API_URL}/api/saldo/${userData.numero}`);
                const data = await res.json();
                if (data.ok && data.saldo !== undefined) {
                    saldoActual = Number(data.saldo);
                    actualizarHUD();
                    setSyncEstado('🟢 EN VIVO', 'linear-gradient(180deg, #25d366 0%, #128c7e 100%)');
                }
            } catch (e) {
                setSyncEstado('🔴 OFFLINE', '#b31222');
            }
        }

        async function sincronizarSaldo() {
            try {
                setSyncEstado('⏳ GUARDANDO', '#d97706');
                const res = await fetch(`${API_URL}/api/slot`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ numero: userData.numero, saldo: saldoActual })
                });
                const data = await res.json();
                if (data.ok) {
                    setSyncEstado('🟢 EN VIVO', 'linear-gradient(180deg, #25d366 0%, #128c7e 100%)');
                }
            } catch (e) {
                setSyncEstado('🔴 ERROR', '#b31222');
            }
        }

        /* ================= MOTOR 3D PRIMERA PERSONA (CANVAS) ================= */
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const W = canvas.width;
        const H = canvas.height;
        const FOV = 260;

        let jugando = false;
        let tocando = false;
        let frame = 0;
        let botin = 0;
        let bajas = 0;
        let escudos = 3;
        let flashRojo = 0;
        let sacudida = 0;

        // Posición de la mira / dirección de la nave
        let aimX = W / 2;
        let aimY = H * 0.42;
        let camX = 0;
        let camY = 0;

        // Estrellas 3D
        let estrellas = Array.from({ length: 75 }, () => ({
            x: (Math.random() - 0.5) * 900,
            y: (Math.random() - 0.5) * 900,
            z: Math.random() * 1000 + 50
        }));

        let entidades = []; // Asteroides, drones, semillas, cristales
        let laseres = [];
        let particulas = [];

        function actualizarPuntero(clientX, clientY) {
            const rect = canvas.getBoundingClientRect();
            const sx = (clientX - rect.left) * (W / rect.width);
            const sy = (clientY - rect.top) * (H / rect.height);
            aimX = Math.max(30, Math.min(W - 30, sx));
            aimY = Math.max(30, Math.min(H - 110, sy));
        }

        canvas.addEventListener('touchstart', (e) => {
            e.preventDefault();
            tocando = true;
            actualizarPuntero(e.touches[0].clientX, e.touches[0].clientY);
        }, { passive: false });

        canvas.addEventListener('touchmove', (e) => {
            e.preventDefault();
            if (tocando) actualizarPuntero(e.touches[0].clientX, e.touches[0].clientY);
        }, { passive: false });

        canvas.addEventListener('touchend', () => { tocando = false; });

        canvas.addEventListener('mousedown', (e) => {
            tocando = true;
            actualizarPuntero(e.clientX, e.clientY);
        });
        window.addEventListener('mousemove', (e) => {
            if (tocando) actualizarPuntero(e.clientX, e.clientY);
        });
        window.addEventListener('mouseup', () => { tocando = false; });

        function crearExplosion(sx, sy, color, cant = 14) {
            for (let i = 0; i < cant; i++) {
                const ang = Math.random() * Math.PI * 2;
                const sp = Math.random() * 4.5 + 1;
                particulas.push({
                    x: sx, y: sy,
                    vx: Math.cos(ang) * sp,
                    vy: Math.sin(ang) * sp,
                    vida: 1,
                    color,
                    r: Math.random() * 3.5 + 1.5
                });
            }
        }

        function despegar() {
            if (saldoActual < COSTO_DESPEGUE) {
                return alert(`❌ Necesitas al menos ${COSTO_DESPEGUE} 🪙 para despegar.`);
            }

            saldoActual -= COSTO_DESPEGUE;
            actualizarHUD();
            sincronizarSaldo();

            entidades = [];
            laseres = [];
            particulas = [];
            botin = 0;
            bajas = 0;
            escudos = 3;
            frame = 0;
            flashRojo = 0;
            sacudida = 0;
            aimX = W / 2;
            aimY = H * 0.42;
            jugando = true;

            document.getElementById('ui-botin').innerText = '+0';
            document.getElementById('ui-bajas').innerText = '0';
            actualizarEscudosUI();
            document.getElementById('canvas-overlay').style.display = 'none';

            requestAnimationFrame(loop);
        }

        async function terminarPartida() {
            jugando = false;
            RetroSFX.dano();
            saldoActual += botin;
            actualizarHUD();
            await sincronizarSaldo();

            const overlay = document.getElementById('canvas-overlay');
            const lootBox = document.getElementById('ov-loot');
            document.getElementById('ov-title').innerText = 'ESCUDOS AGOTADOS';
            document.getElementById('ov-sub').innerText = `Drones destruidos: ${bajas}`;
            lootBox.style.display = 'block';
            lootBox.innerText = `BOTÍN COBRADO: +${botin.toLocaleString()} 🪙`;
            document.getElementById('btn-launch').innerText = `VOLAR DE NUEVO (${COSTO_DESPEGUE} 🪙)`;
            overlay.style.display = 'flex';
        }

        function proyectar(x, y, z) {
            const escala = FOV / z;
            return {
                sx: W / 2 + (x - camX) * escala,
                sy: H * 0.42 + (y - camY) * escala,
                escala
            };
        }

        function dibujarCabina() {
            // Marco curvo del parabrisas
            ctx.strokeStyle = '#334155';
            ctx.lineWidth = 8;
            ctx.beginPath();
            ctx.moveTo(0, H - 85);
            ctx.quadraticCurveTo(W / 2, H - 125, W, H - 85);
            ctx.stroke();

            // Tablero metálico inferior del Space Cruiser
            const grad = ctx.createLinearGradient(0, H - 95, 0, H);
            grad.addColorStop(0, '#1e293b');
            grad.addColorStop(1, '#090d16');
            ctx.fillStyle = grad;
            ctx.beginPath();
            ctx.moveTo(0, H - 82);
            ctx.quadraticCurveTo(W / 2, H - 120, W, H - 82);
            ctx.lineTo(W, H);
            ctx.lineTo(0, H);
            ctx.closePath();
            ctx.fill();

            // Línea neón del tablero
            ctx.strokeStyle = '#00e5ff';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(18, H - 76);
            ctx.quadraticCurveTo(W / 2, H - 110, W - 18, H - 76);
            ctx.stroke();

            // Tubo central de fluido de portal verde
            ctx.fillStyle = '#022c22';
            ctx.fillRect(W / 2 - 48, H - 55, 96, 14);
            ctx.fillStyle = '#39ff14';
            ctx.shadowBlur = 10;
            ctx.shadowColor = '#39ff14';
            ctx.fillRect(W / 2 - 45, H - 52, 90 * (escudos / 3), 8);
            ctx.shadowBlur = 0;

            // Etiqueta del tablero
            ctx.fillStyle = '#94a3b8';
            ctx.font = 'bold 9px Orbitron, sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText('SPACE CRUISER C-137 • FLUIDO PORTAL', W / 2, H - 22);

            // Cañones laterales
            ctx.fillStyle = '#475569';
            ctx.fillRect(14, H - 102, 16, 36);
            ctx.fillRect(W - 30, H - 102, 16, 36);
            ctx.fillStyle = '#39ff14';
            ctx.fillRect(19, H - 105, 6, 6);
            ctx.fillRect(W - 25, H - 105, 6, 6);
        }

        function dibujarMira() {
            ctx.save();
            ctx.translate(aimX, aimY);
            ctx.strokeStyle = '#39ff14';
            ctx.lineWidth = 2;
            ctx.shadowBlur = 8;
            ctx.shadowColor = '#39ff14';

            ctx.beginPath();
            ctx.arc(0, 0, 16, 0, Math.PI * 2);
            ctx.stroke();

            ctx.beginPath();
            ctx.moveTo(-22, 0); ctx.lineTo(-10, 0);
            ctx.moveTo(10, 0); ctx.lineTo(22, 0);
            ctx.moveTo(0, -22); ctx.lineTo(0, -10);
            ctx.moveTo(0, 10); ctx.lineTo(0, 22);
            ctx.stroke();

            ctx.fillStyle = '#39ff14';
            ctx.beginPath();
            ctx.arc(0, 0, 2.5, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
        }

        function dibujarEscenaInicial() {
            ctx.fillStyle = '#02040a';
            ctx.fillRect(0, 0, W, H);
            estrellas.forEach(e => {
                const p = proyectar(e.x, e.y, e.z);
                ctx.fillStyle = '#fff';
                ctx.fillRect(p.sx, p.sy, 2, 2);
            });
            dibujarCabina();
            dibujarMira();
        }

        function loop() {
            if (!jugando) return;
            frame++;

            // Suavizado de cámara según hacia dónde apuntas
            const targetCamX = (aimX - W / 2) * 1.4;
            const targetCamY = (aimY - H * 0.42) * 1.4;
            camX += (targetCamX - camX) * 0.12;
            camY += (targetCamY - camY) * 0.12;

            // Disparo automático mientras tocas la pantalla
            if (tocando && frame % 11 === 0) {
                RetroSFX.laser();
                laseres.push({ x: 22, y: H - 102, tx: aimX, ty: aimY, p: 0 });
                laseres.push({ x: W - 22, y: H - 102, tx: aimX, ty: aimY, p: 0 });
            }

            // Generar enemigos y botín en el horizonte 3D
            if (frame % 38 === 0) {
                const rnd = Math.random();
                let tipo = 'asteroide';
                if (rnd < 0.42) tipo = 'dron';
                else if (rnd < 0.65) tipo = 'semilla';
                else if (rnd < 0.77) tipo = 'cristal';

                entidades.push({
                    tipo,
                    x: (Math.random() - 0.5) * 420 + camX * 0.3,
                    y: (Math.random() - 0.5) * 360 + camY * 0.3,
                    z: 950,
                    vel: tipo === 'dron' ? 11.5 : 9.5,
                    radio: tipo === 'asteroide' ? 32 : 24
                });
            }

            // Fondo espacial con ligera sacudida si recibes impacto
            ctx.save();
            if (sacudida > 0) {
                ctx.translate((Math.random() - 0.5) * sacudida, (Math.random() - 0.5) * sacudida);
                sacudida *= 0.85;
                if (sacudida < 0.5) sacudida = 0;
            }

            ctx.fillStyle = '#02040a';
            ctx.fillRect(0, 0, W, H);

            // Estrellas volando en 3D
            estrellas.forEach(e => {
                e.z -= 12;
                if (e.z <= 10) {
                    e.x = (Math.random() - 0.5) * 900;
                    e.y = (Math.random() - 0.5) * 900;
                    e.z = 1000;
                }
                const p = proyectar(e.x, e.y, e.z);
                const tam = Math.max(1, (1 - e.z / 1000) * 3.2);
                ctx.fillStyle = `rgba(200, 240, 255, ${1 - e.z / 1000})`;
                ctx.fillRect(p.sx, p.sy, tam, tam);
            });

            // Ordenar entidades de lejos a cerca (Z-buffer)
            entidades.sort((a, b) => b.z - a.z);

            for (let i = entidades.length - 1; i >= 0; i--) {
                const ent = entidades[i];
                ent.z -= ent.vel;
                const p = proyectar(ent.x, ent.y, ent.z);
                const rPantalla = Math.max(4, ent.radio * p.escala);

                // Dibujar según tipo
                ctx.save();
                ctx.translate(p.sx, p.sy);
                if (ent.tipo === 'dron') {
                    ctx.fillStyle = '#ff2a55';
                    ctx.shadowBlur = 12;
                    ctx.shadowColor = '#ff2a55';
                    ctx.beginPath();
                    ctx.arc(0, 0, rPantalla, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = '#fff';
                    ctx.beginPath();
                    ctx.arc(0, 0, rPantalla * 0.35, 0, Math.PI * 2);
                    ctx.fill();
                } else if (ent.tipo === 'asteroide') {
                    ctx.fillStyle = '#475569';
                    ctx.strokeStyle = '#94a3b8';
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.arc(0, 0, rPantalla, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.stroke();
                } else {
                    ctx.shadowBlur = 14;
                    ctx.shadowColor = ent.tipo === 'cristal' ? '#00e5ff' : '#39ff14';
                    ctx.font = `${Math.floor(rPantalla * 1.9)}px Arial`;
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText(ent.tipo === 'cristal' ? '💎' : '🌰', 0, 0);
                }
                ctx.restore();

                // Impacto de láser contra drones o asteroides
                let destruido = false;
                if (ent.tipo === 'dron' || ent.tipo === 'asteroide') {
                    for (let j = laseres.length - 1; j >= 0; j--) {
                        const l = laseres[j];
                        const lx = l.x + (l.tx - l.x) * l.p;
                        const ly = l.y + (l.ty - l.y) * l.p;
                        if (l.p > 0.45 && Math.hypot(lx - p.sx, ly - p.sy) < rPantalla + 14) {
                            laseres.splice(j, 1);
                            if (ent.tipo === 'dron') {
                                botin += 30;
                                bajas++;
                                document.getElementById('ui-botin').innerText = `+${botin}`;
                                document.getElementById('ui-bajas').innerText = bajas;
                                crearExplosion(p.sx, p.sy, '#ff2a55', 16);
                                RetroSFX.explosion();
                                destruido = true;
                            } else {
                                crearExplosion(p.sx, p.sy, '#94a3b8', 8);
                                RetroSFX.explosion();
                                destruido = true;
                            }
                            break;
                        }
                    }
                }
                if (destruido) { entidades.splice(i, 1); continue; }

                // Colisión al llegar al parabrisas (z <= 55)
                if (ent.z <= 55) {
                    const distCentro = Math.hypot(p.sx - W / 2, p.sy - H * 0.45);
                    if (ent.tipo === 'semilla' || ent.tipo === 'cristal') {
                        if (distCentro < 110 || Math.hypot(p.sx - aimX, p.sy - aimY) < 75) {
                            const val = ent.tipo === 'cristal' ? 60 : 25;
                            botin += val;
                            document.getElementById('ui-botin').innerText = `+${botin}`;
                            crearExplosion(p.sx, p.sy, ent.tipo === 'cristal' ? '#00e5ff' : '#39ff14', 12);
                            RetroSFX.botin();
                        }
                    } else if (distCentro < 85) {
                        escudos--;
                        actualizarEscudosUI();
                        flashRojo = 0.55;
                        sacudida = 14;
                        RetroSFX.dano();
                        if (escudos <= 0) {
                            ctx.restore();
                            return terminarPartida();
                        }
                    }
                    entidades.splice(i, 1);
                }
            }

            // Dibujar rayos láser
            for (let i = laseres.length - 1; i >= 0; i--) {
                const l = laseres[i];
                l.p += 0.16;
                const x1 = l.x + (l.tx - l.x) * Math.max(0, l.p - 0.25);
                const y1 = l.y + (l.ty - l.y) * Math.max(0, l.p - 0.25);
                const x2 = l.x + (l.tx - l.x) * l.p;
                const y2 = l.y + (l.ty - l.y) * l.p;

                ctx.strokeStyle = '#39ff14';
                ctx.lineWidth = 3;
                ctx.shadowBlur = 10;
                ctx.shadowColor = '#39ff14';
                ctx.beginPath();
                ctx.moveTo(x1, y1);
                ctx.lineTo(x2, y2);
                ctx.stroke();
                ctx.shadowBlur = 0;

                if (l.p >= 1) laseres.splice(i, 1);
            }

            // Partículas de explosión
            for (let i = particulas.length - 1; i >= 0; i--) {
                const pt = particulas[i];
                pt.x += pt.vx;
                pt.y += pt.vy;
                pt.vida -= 0.04;
                if (pt.vida <= 0) { particulas.splice(i, 1); continue; }
                ctx.globalAlpha = pt.vida;
                ctx.fillStyle = pt.color;
                ctx.beginPath();
                ctx.arc(pt.x, pt.y, pt.r, 0, Math.PI * 2);
                ctx.fill();
                ctx.globalAlpha = 1;
            }

            dibujarMira();
            dibujarCabina();

            // Destello rojo de daño
            if (flashRojo > 0) {
                ctx.fillStyle = `rgba(255, 30, 60, ${flashRojo})`;
                ctx.fillRect(0, 0, W, H);
                flashRojo -= 0.04;
            }

            ctx.restore();
            requestAnimationFrame(loop);
        }

        /* ================= CARGA INMEDIATA DE PARÁMETROS URL ================= */
        (function cargarDatosURL() {
            try {
                const params = new URLSearchParams(window.location.search);
                const num = params.get('num');
                const user = params.get('user');
                const cr = params.get('cr');

                if (num) document.getElementById('input-num').value = num;
                if (user) document.getElementById('input-name').value = user;
                saldoActual = parseInt(cr, 10) || 0;

                actualizarHUD();
                dibujarEscenaInicial();
            } catch (e) {
                console.error('Error leyendo URL:', e);
            }
        })();
    </script>
